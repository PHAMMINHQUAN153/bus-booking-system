<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý tuyến xe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green:#0f5c45;--page:#f2f5f3;--ink:#1b2a24;--muted:#5b6b64;--amber:#ffb400;--red:#b3261e;--line:#d5ded9;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
header{background:var(--green);color:var(--white);padding:28px 20px 24px;border-bottom:6px solid var(--white);box-shadow:0 6px 0 var(--green)}
.wrap{max-width:900px;margin:0 auto}
header h1{margin:0;font-size:1.75rem;font-weight:700;letter-spacing:-.01em}
header p{margin:4px 0 0;opacity:.85}
main{padding:36px 20px 60px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.bar h2{margin:0;font-size:1.15rem}
button{font:inherit;cursor:pointer;border-radius:6px;border:2px solid var(--ink);background:var(--white);color:var(--ink);padding:8px 16px;font-weight:500}
button:hover{background:#e8efeb}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.primary{background:var(--amber);border-color:var(--ink);font-weight:700}
.primary:hover{background:#ffc83d}
.danger{color:var(--red);border-color:var(--red)}
.tablebox{overflow-x:auto;background:var(--white);border:2px solid var(--ink);border-radius:8px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.9rem;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
td.route{font-weight:700}
td.route span{color:var(--green);padding:0 6px}
td.act{text-align:right}
td.act button{padding:4px 12px;margin-left:6px}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
#msg{min-height:1.5em;margin:12px 0 0;font-weight:500}
#msg.err{color:var(--red)}
dialog{border:2px solid var(--ink);border-radius:10px;padding:24px;width:min(420px,92vw);color:var(--ink);font-family:inherit}
dialog::backdrop{background:rgba(27,42,36,.55)}
dialog h3{margin:0 0 16px}
label{display:block;margin-bottom:14px;font-weight:500}
input{display:block;width:100%;margin-top:4px;padding:8px 10px;font:inherit;border:2px solid var(--ink);border-radius:6px}
.row{display:flex;gap:12px}
.row label{flex:1}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Quản lý tuyến xe</h1>
    <p>Danh sách tuyến xe khách xuất phát từ TP. Hồ Chí Minh</p>
  </div>
</header>
<main>
  <div class="wrap">
    <div class="bar">
      <h2 id="count">Các tuyến</h2>
      <button class="primary" id="addBtn">Thêm tuyến</button>
    </div>
    <div class="tablebox">
      <table>
        <thead><tr><th>Tuyến</th><th class="num">Khoảng cách</th><th class="num">Thời gian</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="msg" role="status" aria-live="polite"></p>
  </div>
</main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h3 id="dlgTitle">Thêm tuyến</h3>
    <label>Điểm đi <input id="origin" required maxlength="100"></label>
    <label>Điểm đến <input id="destination" required maxlength="100"></label>
    <div class="row">
      <label>Khoảng cách (km) <input id="distanceKm" type="number" min="1" required></label>
      <label>Thời gian (phút) <input id="durationMinutes" type="number" min="1" required></label>
    </div>
    <div class="actions">
      <button type="button" id="cancel">Hủy</button>
      <button class="primary" type="submit">Lưu tuyến</button>
    </div>
  </form>
</dialog>

<script>
const API = '/api/routes';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let routes = [];
let editingId = null;

function say(text, isError) {
  const m = $('#msg');
  m.textContent = text;
  m.className = isError ? 'err' : '';
}

function duration(min) {
  const h = Math.floor(min / 60), m = min % 60;
  return h + ' giờ' + (m ? ' ' + m + ' phút' : '');
}

async function request(url, options) {
  let res;
  try {
    res = await fetch(url, options);
  } catch (e) {
    throw new Error('Không kết nối được máy chủ. Kiểm tra ứng dụng Spring Boot đã chạy chưa.');
  }
  if (res.status === 400) throw new Error('Dữ liệu chưa hợp lệ. Kiểm tra lại các ô đã nhập.');
  if (res.status === 404) throw new Error('Không tìm thấy tuyến này. Có thể nó đã bị xóa.');
  if (!res.ok) throw new Error('Máy chủ trả về lỗi ' + res.status + '.');
  return res.status === 204 ? null : res.json();
}

function render() {
  $('#count').textContent = routes.length ? routes.length + ' tuyến' : 'Các tuyến';
  if (!routes.length) {
    $('#rows').innerHTML = '<tr><td colspan="4" class="empty">Chưa có tuyến nào. Chọn “Thêm tuyến” để tạo tuyến đầu tiên.</td></tr>';
    return;
  }
  $('#rows').innerHTML = routes.map(r => `
    <tr>
      <td class="route">${esc(r.origin)}<span>→</span>${esc(r.destination)}</td>
      <td class="num">${esc(r.distanceKm)} km</td>
      <td class="num">${duration(r.durationMinutes)}</td>
      <td class="act">
        <button data-edit="${r.id}">Sửa</button>
        <button class="danger" data-del="${r.id}">Xóa</button>
      </td>
    </tr>`).join('');
}

async function load() {
  try {
    routes = await request(API);
    say('');
    render();
  } catch (e) {
    say(e.message, true);
  }
}

function openForm(route) {
  editingId = route ? route.id : null;
  $('#dlgTitle').textContent = route ? 'Sửa tuyến' : 'Thêm tuyến';
  $('#origin').value = route ? route.origin : 'TP. Hồ Chí Minh';
  $('#destination').value = route ? route.destination : '';
  $('#distanceKm').value = route ? route.distanceKm : '';
  $('#durationMinutes').value = route ? route.durationMinutes : '';
  $('#dlg').showModal();
}

$('#addBtn').addEventListener('click', () => openForm(null));
$('#cancel').addEventListener('click', () => $('#dlg').close());

$('#form').addEventListener('submit', async () => {
  const body = {
    origin: $('#origin').value.trim(),
    destination: $('#destination').value.trim(),
    distanceKm: Number($('#distanceKm').value),
    durationMinutes: Number($('#durationMinutes').value)
  };
  const url = editingId ? API + '/' + editingId : API;
  try {
    await request(url, {
      method: editingId ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    say(editingId ? 'Đã lưu thay đổi.' : 'Đã thêm tuyến.');
    await load();
  } catch (e) {
    say(e.message, true);
  }
});

$('#rows').addEventListener('click', async e => {
  const editId = e.target.dataset.edit, delId = e.target.dataset.del;
  if (editId) openForm(routes.find(r => String(r.id) === editId));
  if (delId) {
    const r = routes.find(x => String(x.id) === delId);
    if (!confirm('Xóa tuyến ' + r.origin + ' → ' + r.destination + '?')) return;
    try {
      await request(API + '/' + delId, { method: 'DELETE' });
      say('Đã xóa tuyến.');
      await load();
    } catch (err) {
      say(err.message, true);
    }
  }
});

load();
</script>
</body>
</html>
